# Инфраструктура HR-помощника: база данных и векторный поиск.
# Само приложение (FastAPI + Next.js) запускается локально через dev.ps1.
#
#   docker compose up -d      # поднять
#   docker compose down       # остановить (данные сохраняются в томах)
#
# Учётные данные ниже — для локальной разработки. Для боевого окружения
# задайте их через .env и не храните в репозитории.

services:
  postgres:
    image: postgres:17
    container_name: hr-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hr_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-hr_helper}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - hr_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hr} -d ${POSTGRES_DB:-hr_helper}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - hr_qdrant:/qdrant/storage
    restart: unless-stopped

volumes:
  hr_pgdata:
  hr_qdrant:
